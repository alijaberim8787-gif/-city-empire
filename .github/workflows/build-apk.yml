name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install CMake 3.31.4 via Android sdkmanager
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.31.4" || true
          # اطمینان از اینکه مسیر CMake نصب‌شده در PATH قرار می‌گیرد
          echo "$ANDROID_HOME/cmake/3.31.4/bin" >> $GITHUB_PATH

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Android platform files
        run: flutter create . --platforms=android

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: city-empire-apk
          path: build/app/outputs/flutter-apk/app-release.apk
